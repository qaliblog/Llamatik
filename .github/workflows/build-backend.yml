name: Build Backend

on:
  push:
    branches: [ "master" ]
    paths:
      - 'backend/**'
      - 'library/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'backend/**'
      - 'library/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Backend with Gradle
        run: ./gradlew :backend:build

      - name: Build Shadow Jar
        run: ./gradlew :backend:shadowJar

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llamatik-backend-jar
          path: backend/build/libs/*-all.jar
